server {
    listen 80;
    server_name _;
    access_log /dev/stdout;
    error_log /dev/stderr;
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}\n';
    }
    location = /failure {
        default_type application/json;
        return 500 '{"status":"failed"}\n';
    }
}
