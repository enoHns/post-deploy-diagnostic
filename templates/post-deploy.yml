spec:
  inputs:
    image:
      description: Published diagnostic image, pinned to a version or digest
    job-name:
      default: post_deploy_diagnostic
    stage:
      default: .post
    config:
      default: diagnostic.yml
    needs:
      type: array
      description: Deployment jobs that must succeed before this diagnostic
    runner-tags:
      type: array
      default: []
---
"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  needs: $[[ inputs.needs ]]
  tags: $[[ inputs.runner-tags ]]
  variables:
    DIAGNOSTIC_CONFIG: $[[ inputs.config ]]
  before_script: []
  after_script: []
  services: []
  cache: []
  allow_failure: false
  script:
    - diagnostic run --config "$DIAGNOSTIC_CONFIG" --json-report reports/diagnostic.json --junit-report reports/diagnostic.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/]
    reports:
      junit: reports/diagnostic.xml
